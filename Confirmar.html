<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação</title>
    <div id="cabeçalho-geral"></div>
    
    <script>
     fetch('/header.html')
     .then(response => response.text())
     .then(data => {
          document.getElementById('cabeçalho-geral').innerHTML = data;
     });
    </script>

</head>
<body>
    <section class="wizard-step" id="step-4">
            <h2>(Confirmação) Confirme os seus Dados</h2>
            <div class="summary-card">
                <h3>Resumo do Agendamento</h3>
                <p><strong>Serviço:</strong> <span id="summary-service">-</span></p>
                <p><strong>Profissional:</strong> <span id="summary-professional">-</span></p>
                <p><strong>Data:</strong> <span id="summary-date">-</span></p>
                <p><strong>Horário:</strong> <span id="summary-time">-</span></p>
                <p class="total-price"><strong>Total:</strong> <span id="summary-price">0,00 R$</span></p>
            </div>
            <form id="client-form" class="client-form">
                <div class="form-group">
                    <label for="client-name">Nome Completo:</label>
                    <input type="text" id="client-name" required placeholder="Ex: Joana Ferreira">
                </div>
                <div class="form-group">
                    <label for="client-phone">Telemóvel:</label>
                    <input type="tel" id="client-phone" required placeholder="Ex: 912 345 678">
                </div>
                <button type="submit" class="btn-confirm">Finalizar Agendamento</button>
            </form>
        </section>

        <!-- Navegação Inferior -->
        <div class="nav-controls">
            <button id="btn-prev" class="btn-nav" disabled>Voltar</button>
            <button id="btn-next" class="btn-nav" disabled>Avançar</button>
        </div>

        <!-- Janela Modal de Sucesso -->
        <div class="modal" id="success-modal">
            <div class="modal-content">
                <div class="success-icon">✓</div>
                <h2>Agendamento Realizado!</h2>
                <p>O seu horário foi reservado com sucesso. Esperamos por si!</p>
                <button onclick="window.location.reload()" class="btn-confirm">Novo Agendamento</button>
            </div>
        </div>
    </main>

</body>
</html>
